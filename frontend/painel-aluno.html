<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Painel do Aluno - ES@Escolar</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .card-status { display: flex; gap: 20px; margin-top: 20px; flex-wrap: wrap; }
    .status-box { flex: 1; min-width: 200px; background: white; padding: 20px; border-radius: 16px; box-shadow: var(--sombra); border-left: 6px solid var(--azul-suave); }
    .status-box.alerta { border-left-color: #E57373; }
    .status-box .valor { font-size: 32px; font-weight: bold; color: var(--azul-medio); }
  </style>
</head>
<body>
  <div class="dashboard">
    <aside class="sidebar"><div class="brand"><img src="assets/logo.svg"><span>ES@Escolar</span></div><nav id="menu"></nav></aside>
    <main class="content">
      <div class="header-pagina">
        <h2 id="saudacao">Carregando...</h2>
        <button class="btn-acao" onclick="logout()" style="border-color:#E57373; color:#E57373;">Sair do Sistema</button>
      </div>
      <p id="info-turma" style="color: #7a8b99; margin-bottom: 20px;"></p>

      <div class="card-status">
        <div class="status-box" id="box-frequencia">
          <h4>Frequência Geral</h4>
          <div class="valor" id="valor-frequencia">...</div>
          <span id="status-frequencia" style="font-size:14px;"></span>
        </div>
        <div class="status-box">
          <h4>Média Global (Todas as Matérias)</h4>
          <div class="valor" id="valor-media">...</div>
        </div>
      </div>
    </main>
  </div>

  <script src="js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const u = App.exigirTipo('aluno'); if(!u) return;
      App.renderizarMenu(u);
      document.getElementById('saudacao').textContent = `Olá, ${App.primeiroNome(u.nome)}! 👋`;

      try {
        // Aqui precisamos do ID do Aluno, que é diferente do ID de Usuário. 
        // Para simplificar, vou assumir que o backend retorna o aluno_id no login. 
        // Se não retornar, faremos um mock com o ID 1 (João Benício)
        const aluno_id = u.aluno_id || 1;

        // Frequência Real
        const freq = await App.get(`/api/frequencia/aluno/${aluno_id}`);
        document.getElementById('valor-frequencia').textContent = `${freq.percentual}%`;
        
        const boxFreq = document.getElementById('box-frequencia');
        const statusFreq = document.getElementById('status-frequencia');
        if (freq.percentual < 75) {
          boxFreq.classList.add('alerta');
          statusFreq.innerHTML = '⚠️ ATENÇÃO (Abaixo de 75%)';
          statusFreq.style.color = '#E57373';
        } else {
          statusFreq.innerHTML = '✅ Regular';
          statusFreq.style.color = '#66BB6A';
        }

        // Média Global Real
        const media = await App.get(`/api/notas/media-global/${aluno_id}`);
        document.getElementById('valor-media').textContent = App.formatarNota(media.media_global);

      } catch(e) {
        console.error(e);
        App.erro('Erro ao carregar dados.');
      }
    });
  </script>
</body>
</html>
