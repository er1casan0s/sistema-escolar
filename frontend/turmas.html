<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Turmas - Sistema Escolar</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="dashboard">
    <aside class="sidebar">
      <div class="brand"><img src="assets/logo.svg"><span>ES@Escolar</span></div>
      <nav id="menu"></nav>
    </aside>
    <main class="content">
      <div class="header-pagina">
        <h2>Gerenciar Turmas</h2>
        <button class="btn-primario" onclick="abrirModal()">+ Nova Turma</button>
      </div>

      <div class="card">
        <table class="tabela">
          <thead>
            <tr>
              <th>Turma</th>
              <th>Turno</th>
              <th>Ano</th>
              <th>Alunos</th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody id="tabela-turmas">
            <tr><td colspan="5">Carregando...</td></tr>
          </tbody>
        </table>
      </div>
    </main>
  </div>

  <!-- Modal Simples para Cadastro -->
  <div id="modal-turma" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); align-items:center; justify-content:center;">
    <div class="card" style="width: 400px;">
      <h3>Nova Turma</h3>
      <form id="form-turma" style="margin-top:15px;">
        <label>Nome da Turma (Ex: 1º Ano)</label>
        <input type="text" id="nome-turma" required>
        
        <label>Turno</label>
        <select id="turno-turma" required style="width:100%; padding:10px; margin-bottom:15px; border-radius:10px; border:1px solid #ccc;">
          <option value="Manhã">Manhã</option>
          <option value="Tarde">Tarde</option>
        </select>
        
        <div style="display:flex; gap:10px; margin-top:20px;">
          <button type="button" class="btn-acao" onclick="fecharModal()" style="width:100%;">Cancelar</button>
          <button type="submit" class="btn-primario" style="width:100%;">Salvar</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const u = App.exigirTipo('admin'); if(!u) return;
      App.renderizarMenu(u);
      carregarTurmas();
    });

    async function carregarTurmas() {
      try {
        const turmas = await App.get('/api/turmas/');
        const tbody = document.getElementById('tabela-turmas');
        
        if(turmas.length === 0) {
          tbody.innerHTML = '<tr><td colspan="5">Nenhuma turma cadastrada.</td></tr>';
          return;
        }

        tbody.innerHTML = turmas.map(t => `
          <tr>
            <td>${t.nome}</td>
            <td>${t.turno}</td>
            <td>${t.ano}</td>
            <td>${t.qtd_alunos}</td>
            <td>
              <button class="btn-acao" style="border-color:#E57373; color:#E57373;" onclick="excluirTurma(${t.id})">Excluir</button>
            </td>
          </tr>
        `).join('');
      } catch (e) {
        App.erro('Erro ao carregar turmas.');
      }
    }

    function abrirModal() { document.getElementById('modal-turma').style.display = 'flex'; }
    function fecharModal() { document.getElementById('modal-turma').style.display = 'none'; }

    document.getElementById('form-turma').addEventListener('submit', async (e) => {
      e.preventDefault();
      const nome = document.getElementById('nome-turma').value;
      const turno = document.getElementById('turno-turma').value;

      try {
        const res = await App.post('/api/turmas/', { nome, turno, ano: 2026 });
        App.sucesso(res.mensagem);
        fecharModal();
        carregarTurmas();
      } catch (e) {
        App.erro(e.message);
      }
    });

    async function excluirTurma(id) {
      if(!confirm('Tem certeza que deseja excluir esta turma?')) return;
      try {
        const res = await App.del(`/api/turmas/${id}`);
        App.sucesso(res.mensagem);
        carregarTurmas();
      } catch (e) {
        App.erro(e.message);
      }
    }
  </script>
</body>
</html>
